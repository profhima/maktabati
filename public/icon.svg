<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#goldGrad)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldLight)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Open Book & Pen Vector -->
  <g filter="url(#shadow)" fill="none" stroke="#FFFDF8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page -->
    <path d="M120 370 C 180 340, 230 350, 256 380 C 256 220, 256 160, 256 160 C 230 130, 180 120, 120 150 Z" fill="#FAF6EE" stroke="#FAF6EE" stroke-width="12" />
    <!-- Right page -->
    <path d="M392 370 C 332 340, 282 350, 256 380 C 256 220, 256 160, 256 160 C 282 130, 332 120, 392 150 Z" fill="#FFFDF8" stroke="#FFFDF8" stroke-width="12" />
    
    <!-- Spine line -->
    <line x1="256" y1="160" x2="256" y2="380" stroke="#B45309" stroke-width="14" />

    <!-- Decorative lines on pages -->
    <line x1="150" y1="200" x2="225" y2="185" stroke="#D97706" stroke-width="10" />
    <line x1="150" y1="240" x2="225" y2="225" stroke="#D97706" stroke-width="10" />
    <line x1="150" y1="280" x2="225" y2="265" stroke="#D97706" stroke-width="10" />

    <line x1="287" y1="185" x2="362" y2="200" stroke="#D97706" stroke-width="10" />
    <line x1="287" y1="225" x2="362" y2="240" stroke="#D97706" stroke-width="10" />
    <line x1="287" y1="265" x2="362" y2="280" stroke="#D97706" stroke-width="10" />
  </g>

  <!-- Sparkle / Crown Accent -->
  <g fill="url(#goldLight)">
    <circle cx="256" cy="115" r="14" />
    <path d="M256 80 L262 105 L287 111 L262 117 L256 142 L250 117 L225 111 L250 105 Z" />
  </g>
</svg>
